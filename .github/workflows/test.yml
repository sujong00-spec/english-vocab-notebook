name: App tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/vocab-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:4173 && break || sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-screenshots
          path: test-results/
